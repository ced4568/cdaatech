<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">CDAA future venture radar</title>
  <desc id="desc">A launch-horizon radar showing infrastructure services, rack systems and PC parts, home energy systems, and robotic lawn systems.</desc>
  <rect width="800" height="600" fill="#111827"/>
  <g transform="translate(400 305)" fill="none">
    <circle r="220" stroke="#334155"/><circle r="155" stroke="#334155"/><circle r="90" stroke="#334155"/>
    <path d="M-250 0H250M0-250V250M-177-177L177 177M177-177L-177 177" stroke="#334155"/>
    <path d="M0 0L184-121A220 220 0 0 1 220-10Z" fill="#3B82F6" opacity=".12" stroke="#3B82F6" stroke-width="2"/>
    <circle r="22" fill="#F8FAFC" stroke="#3B82F6" stroke-width="5"/>
    <circle cx="70" cy="-54" r="11" fill="#3B82F6"/>
    <circle cx="-116" cy="-88" r="11" fill="#F97316"/>
    <circle cx="142" cy="88" r="11" fill="#22D3EE"/>
    <circle cx="-174" cy="126" r="11" fill="#A78BFA"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="56" fill="#94A3B8" font-size="18" letter-spacing="4">CDAA VENTURE RADAR</text>
    <text x="48" y="82" fill="#64748B" font-size="12" letter-spacing="2">LAUNCH HORIZON / 2026–2028</text>

    <g transform="translate(495 152)">
      <text fill="#F8FAFC" font-size="16" font-weight="700">Engineering + Infrastructure</text>
      <text y="21" fill="#60A5FA" font-size="11" font-weight="700" letter-spacing="2">SERVICE PILOT</text>
      <text y="40" fill="#64748B" font-size="11">Kubernetes / hardware installs</text>
    </g>
    <g transform="translate(90 168)">
      <text fill="#F8FAFC" font-size="16" font-weight="700">Rack Systems + PC Parts</text>
      <text y="21" fill="#FB923C" font-size="11" font-weight="700" letter-spacing="2">ECOMMERCE / NEAR TERM</text>
    </g>
    <g transform="translate(555 414)">
      <text fill="#F8FAFC" font-size="16" font-weight="700">Home Energy Systems</text>
      <text y="21" fill="#22D3EE" font-size="11" font-weight="700" letter-spacing="2">VALIDATING</text>
      <text y="40" fill="#64748B" font-size="11">Backup batteries / generators</text>
    </g>
    <g transform="translate(74 450)">
      <text fill="#F8FAFC" font-size="16" font-weight="700">Robotic Lawn Systems</text>
      <text y="21" fill="#A78BFA" font-size="11" font-weight="700" letter-spacing="2">EXPLORING</text>
    </g>

    <text x="380" y="310" fill="#0F172A" font-size="12" font-weight="900" letter-spacing="1">CDAA</text>
  </g>
  <g font-family="JetBrains Mono,monospace" font-size="12" fill="#64748B">
    <text x="48" y="552">INNER: BUILD</text>
    <text x="328" y="552">MIDDLE: VALIDATE</text>
    <text x="650" y="552">OUTER: EXPLORE</text>
  </g>
</svg>
